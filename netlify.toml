[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# --- headers -----------------------------------------------------------------

# everything: a few sensible security defaults
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

# Astro's CSS/JS/fonts have content hashes in their names, so they can be cached forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# images that keep their names across deploys: cache for a day
[[headers]]
  for = "/gifs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/cursors/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# plain-text and Markdown files (llms.txt, humans.txt, robots.txt, the .md copies), with accents intact
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/thoughts/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

# --- plugins -----------------------------------------------------------------

# after each production deploy: ping IndexNow (Bing/ChatGPT search, Yandex, ...) with the sitemap URLs
[[plugins]]
  package = "./netlify/plugins/indexnow"
  [plugins.inputs]
    key = "8e24897de49e60135ecacfb26f1742bc"
